name: Build patch bundle (API 29 fork)

# Run from the Actions tab: "Build patch bundle (API 29 fork)" > Run workflow, and enter a version
# higher than the last one (e.g. 0.9.0). The .mpp is published as a GitHub release of this fork,
# so Morphe Desktop can use this repository as a Remote patch source.
#
# Needs one repository secret, PACKAGES_TOKEN: a GitHub classic personal access token with the
# read:packages scope (Morphe's Gradle plugin and libraries are on GitHub Packages).

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Bundle version, higher than the last one (e.g. 0.9.0)"
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Point the bundle at this fork and set the version
        env:
          VERSION: ${{ inputs.version }}
          REPO: ${{ github.repository }}
        run: |
          sed -i "s/^version = .*/version = $VERSION/" gradle.properties
          sed -i "s#^projectUrl = .*#projectUrl = https://github.com/$REPO#" gradle.properties
          CREATED=$(date -u +%Y-%m-%dT%H:%M:%S)
          jq --arg v "$VERSION" \
             --arg url "https://github.com/$REPO/releases/download/v$VERSION/patches-$VERSION.mpp" \
             --arg at "$CREATED" \
             '.version=$v | .download_url=$url | .created_at=$at | .signature_download_url=""' \
             patches-bundle.json > tmp.json && mv tmp.json patches-bundle.json
          cat gradle.properties patches-bundle.json

      - name: Build
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.PACKAGES_TOKEN }}
        run: |
          [ -n "$GITHUB_TOKEN" ] || { echo "Add the PACKAGES_TOKEN secret first (see the top of this file)"; exit 1; }
          chmod +x gradlew
          ./gradlew --no-daemon --console=plain buildAndroid
          find patches/build -name "*.mpp"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          FILE=$(find patches/build -name "*.mpp" | head -n 1)
          [ -n "$FILE" ] || { echo "No .mpp produced"; exit 1; }
          cp "$FILE" "patches-$VERSION.mpp"
          gh release create "v$VERSION" "patches-$VERSION.mpp" \
            --title "v$VERSION" --notes "Fork build: accepts AAOS Maps APKs with minSdk 29 (Android 10) as well as 120003.E."

      - name: Commit version and bundle info
        env:
          VERSION: ${{ inputs.version }}
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add gradle.properties patches-bundle.json
          git commit -m "Build v$VERSION" && git push || echo "Nothing to commit"
